spring.application.name=syncro-backend
server.port=8080

# CORS & WebSocket allowed origins (comma-separated)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Logging: keep message payload privacy
logging.level.root=INFO
logging.level.com.syncro=INFO
logging.level.org.springframework.web.socket=INFO

